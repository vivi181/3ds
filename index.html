<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>3D Whale - X光骨架模式</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; } /* 纯黑背景 */
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #ff0000; font-weight: bold; font-family: monospace; pointer-events: none;
            z-index: 10; background-color: rgba(255,255,255,0.1); padding: 10px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">正在启动 X光骨架模式...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // 1. 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // 黑色背景，红线更明显

        // 辅助网格
        scene.add(new THREE.GridHelper(20, 20)); 
        scene.add(new THREE.AxesHelper(5));

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. 加载器
        const objLoader = new OBJLoader();
        const fileName = 'j.obj'; 

        document.getElementById('info').innerHTML = "正在读取 j.obj 数据...";

        objLoader.load(fileName, (object) => {
            
            // A. 计算尺寸与居中
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            console.log("模型数据检测:", size);

            object.position.x -= center.x;
            object.position.y -= center.y;
            object.position.z -= center.z;

            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 5 / (maxDim || 1);
            object.scale.set(scale, scale, scale);

            // B. 【核心诊断】强制变为红色骨架
            let meshCount = 0;
            object.traverse((child) => {
                // 打印每一个子对象的类型，看看是不是 Mesh
                console.log("发现对象:", child.type, child.name);

                if (child.isMesh) {
                    meshCount++;
                    // 强制使用红色线框材质
                    child.material = new THREE.MeshBasicMaterial({
                        color: 0xff0000,    // 纯红色
                        wireframe: true,    // 只要线条
                        side: THREE.DoubleSide
                    });
                }
            });

            scene.add(object);
            
            if (meshCount > 0) {
                document.getElementById('info').innerHTML = `检测到 ${meshCount} 个网格部件，已显示红色骨架`;
            } else {
                document.getElementById('info').innerHTML = "警告：模型文件中没有发现 Mesh (网格)！";
            }

        }, undefined, (error) => {
            console.error(error);
            document.getElementById('info').innerHTML = "加载错误，请看 Console";
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
