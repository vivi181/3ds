<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>3D Whale - 强力贴图版</title>
    <style>
        /* ⚠️ 注意：我把背景改成了深蓝色，方便你确认代码是否更新 */
        body { margin: 0; overflow: hidden; background-color: #001e36; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #fff; font-family: Arial, sans-serif; pointer-events: none;
            z-index: 10; background-color: rgba(0,0,0,0.5); padding: 10px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">如果背景不是深蓝色，请强制刷新！</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // 1. 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x001e36); // 深蓝色背景
        
        // 辅助网格
        scene.add(new THREE.GridHelper(20, 20)); 
        scene.add(new THREE.AxesHelper(5));

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 2. 手动加载贴图 (绕过 .mtl)
        const textureLoader = new THREE.TextureLoader();
        
        // ⚠️ 确保这个文件名和 GitHub 上一模一样！
        const bodyTexture = textureLoader.load('whale_sp1_body_BaseColor.png', 
            () => console.log("贴图加载成功"),
            undefined,
            (err) => console.error("贴图加载失败:", err)
        );
        bodyTexture.colorSpace = THREE.SRGBColorSpace;

        // 3. 加载 OBJ
        const objLoader = new OBJLoader();
        const fileName = 'j.obj'; 

        document.getElementById('info').innerHTML = "正在下载模型...";

        objLoader.load(fileName, (object) => {
            
            // A. 自动缩放与居中
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            // 注意：这里的新日志没有“原始”二字，以此区分新旧代码
            console.log("模型尺寸:", size); 

            object.position.x -= center.x;
            object.position.y -= center.y;
            object.position.z -= center.z;

            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 5 / (maxDim || 1);
            object.scale.set(scale, scale, scale);

            // B. 强力赋予材质
            object.traverse((child) => {
                if (child.isMesh) {
                    // 使用 MeshBasicMaterial，即使没光也能看清，且不受 mtl 影响
                    child.material = new THREE.MeshBasicMaterial({
                        map: bodyTexture,
                        side: THREE.DoubleSide
                    });
                }
            });

            scene.add(object);
            document.getElementById('info').innerHTML = "加载完成！";

        }, (xhr) => {
            if(xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('info').innerHTML = `下载中: ${percent}%`;
            }
        }, (error) => {
            console.error(error);
            document.getElementById('info').innerHTML = "加载失败，请检查 Console";
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
