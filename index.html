<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>3D Whale Viewer - Manual Texture</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: white; font-family: Arial, sans-serif; pointer-events: none;
            z-index: 10; background-color: rgba(0,0,0,0.5); padding: 10px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">正在启动强力加载模式...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // 1. 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        
        // 辅助网格 (确保Three.js在运行)
        scene.add(new THREE.GridHelper(20, 20)); 
        scene.add(new THREE.AxesHelper(5));

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光 (虽然用了Basic材质不需要光，但为了以防万一加上)
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        // 2. 手动加载贴图 (绕过 .mtl 文件)
        const textureLoader = new THREE.TextureLoader();
        
        // 加载身体贴图
        const bodyTexture = textureLoader.load('whale_sp1_body_BaseColor.png', 
            () => console.log("身体贴图加载成功"),
            undefined,
            (err) => console.error("身体贴图加载失败 (检查文件名):", err)
        );
        bodyTexture.colorSpace = THREE.SRGBColorSpace; // 颜色校正

        // 3. 加载 OBJ 模型
        const objLoader = new OBJLoader();
        const fileName = 'j.obj'; // 你的模型文件

        document.getElementById('info').innerHTML = "正在直接读取 j.obj ...";

        objLoader.load(fileName, (object) => {
            
            // --- 核心修复逻辑 ---

            // A. 强制计算并居中
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            console.log("模型尺寸:", size);

            // 居中
            object.position.x -= center.x;
            object.position.y -= center.y;
            object.position.z -= center.z;

            // 缩放 (统一变成 5 米大)
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 5 / (maxDim || 1);
            object.scale.set(scale, scale, scale);

            // B. 【最关键一步】手动给模型穿衣服
            object.traverse((child) => {
                if (child.isMesh) {
                    console.log("找到模型部件:", child.name);
                    
                    // 创建一个全新材质，强制使用身体贴图
                    // 使用 MeshBasicMaterial 不受光照影响，防止因为没灯光变黑
                    const newMaterial = new THREE.MeshBasicMaterial({
                        map: bodyTexture,       // 贴图
                        side: THREE.DoubleSide, // 双面渲染 (防止背面透明)
                        transparent: false,     // 关闭透明
                        opacity: 1
                    });

                    child.material = newMaterial;
                }
            });

            scene.add(object);
            document.getElementById('info').innerHTML = "加载完成！<br>如果不显示，就是图片文件名写错了";

        }, (xhr) => {
            // 进度条
            if(xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('info').innerHTML = `模型下载中: ${percent}%`;
            }
        }, (error) => {
            console.error(error);
            document.getElementById('info').innerHTML = "加载失败，请看F12控制台";
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
