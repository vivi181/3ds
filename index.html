<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>3D Whale Viewer</title>
    <style>
        /* 移除默认边距，防止滚动条 */
        body { margin: 0; overflow: hidden; background-color: #333; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: none;
            z-index: 10;
            background-color: rgba(0,0,0,0.5); /* 半透明背景让文字更清晰 */
            padding: 5px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">正在初始化...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // 1. 基础场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); // 深灰色背景

        // 添加辅助网格 (地面) - 如果看到这个，说明渲染器工作正常
        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);

        // 添加坐标轴 (红=X, 绿=Y, 蓝=Z)
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10); // 相机位置

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. 灯光 (前后左右上下都有光，防止模型太黑)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        
        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-5, -5, -10);
        scene.add(backLight);

        // 3. 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 4. 加载模型
        const mtlLoader = new MTLLoader();
        
        // --- 核心修改：文件名设定为 j ---
        const fileName = 'j'; 
        // -----------------------------

        document.getElementById('info').innerHTML = "正在下载材质文件 (j.mtl)...";

        mtlLoader.load(`${fileName}.mtl`, (materials) => {
            materials.preload();
            
            const objLoader = new OBJLoader();
            objLoader.setMaterials(materials);
            
            document.getElementById('info').innerHTML = "正在下载模型文件 (j.obj)...";

            objLoader.load(`${fileName}.obj`, (object) => {
                
                // --- 自动修复位置和大小的核心代码 ---
                
                // 1. 获取模型的包围盒
                const box = new THREE.Box3().setFromObject(object);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                console.log("模型原始尺寸:", size);
                console.log("模型原始中心:", center);

                // 2. 居中模型 (抵消掉原始模型的偏移)
                object.position.x -= center.x;
                object.position.y -= center.y;
                object.position.z -= center.z;

                // 3. 自动缩放 (统一缩放到 5 个单位大小)
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 5 / (maxDim || 1); 
                object.scale.set(scaleFactor, scaleFactor, scaleFactor);

                scene.add(object);
                
                document.getElementById('info').innerHTML = "加载完成！按住左键旋转，右键平移，滚轮缩放";
                console.log("模型已修正并添加到场景");

            }, (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('info').innerHTML = `模型加载中: ${percent}%`;
                }
            }, (error) => {
                console.error('加载OBJ失败:', error);
                document.getElementById('info').innerHTML = "OBJ加载失败，请看F12控制台";
            });

        }, (xhr) => {
            // MTL 加载进度
        }, (error) => {
            console.error('加载MTL失败:', error);
            document.getElementById('info').innerHTML = "MTL加载失败 (检查文件名j.mtl?)";
        });

        // 5. 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
